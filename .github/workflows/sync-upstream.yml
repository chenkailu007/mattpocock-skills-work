name: Sync upstream skills

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-mattpocock-skills
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate plugin from upstream
        run: npm run sync

      - name: Validate generated plugin
        run: npm run validate

      - name: Open or update the sync pull request
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_BRANCH: automation/sync-mattpocock-skills
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Already synchronized."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$SYNC_BRANCH"
          git add --all
          git commit -m "chore: sync mattpocock skills"
          git push --force-with-lease origin "$SYNC_BRANCH"

          existing_pr="$(gh pr list --head "$SYNC_BRANCH" --state open --json number --jq '.[0].number')"
          if [ -z "$existing_pr" ]; then
            gh pr create \
              --base main \
              --head "$SYNC_BRANCH" \
              --title "chore: sync mattpocock skills" \
              --body "Automated, validated synchronization from https://github.com/mattpocock/skills. Review upstream.lock.json and the generated diff before merging."
          fi
